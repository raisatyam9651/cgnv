<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a73e8"/>
      <stop offset="100%" style="stop-color:#00897b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="680" cy="80" r="55" fill="white" opacity="0.05"/>
  <circle cx="120" cy="355" r="42" fill="white" opacity="0.05"/>
  <!-- Gear/machine icon -->
  <g transform="translate(400,165)" opacity="0.9">
    <!-- Large gear -->
    <circle cx="-20" cy="-10" r="35" fill="white" opacity="0.15" stroke="white" stroke-width="2"/>
    <circle cx="-20" cy="-10" r="15" fill="white" opacity="0.1" stroke="white" stroke-width="2"/>
    <!-- Gear teeth (large) -->
    <rect x="-25" y="-50" width="10" height="12" rx="2" fill="white" opacity="0.4"/>
    <rect x="-25" y="25" width="10" height="12" rx="2" fill="white" opacity="0.4"/>
    <rect x="-60" y="-15" width="12" height="10" rx="2" fill="white" opacity="0.4"/>
    <rect x="8" y="-15" width="12" height="10" rx="2" fill="white" opacity="0.4"/>
    <rect x="-50" y="-42" width="10" height="10" rx="2" fill="white" opacity="0.3" transform="rotate(45,-45,-37)"/>
    <rect x="6" y="18" width="10" height="10" rx="2" fill="white" opacity="0.3" transform="rotate(45,11,23)"/>
    <!-- Small gear -->
    <circle cx="35" cy="25" r="22" fill="white" opacity="0.15" stroke="white" stroke-width="2"/>
    <circle cx="35" cy="25" r="10" fill="white" opacity="0.1" stroke="white" stroke-width="2"/>
    <!-- Gear teeth (small) -->
    <rect x="31" y="-1" width="8" height="8" rx="2" fill="white" opacity="0.4"/>
    <rect x="31" y="45" width="8" height="8" rx="2" fill="white" opacity="0.4"/>
    <rect x="9" y="21" width="8" height="8" rx="2" fill="white" opacity="0.4"/>
    <rect x="53" y="21" width="8" height="8" rx="2" fill="white" opacity="0.4"/>
    <!-- Dollar coming out -->
    <circle cx="65" cy="-30" r="16" fill="white" opacity="0.25"/>
    <text x="65" y="-24" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="18" font-weight="bold">$</text>
    <!-- Arrow -->
    <path d="M40,-5 Q55,-15 60,-25" fill="none" stroke="white" stroke-width="2" stroke-dasharray="3,3" opacity="0.5"/>
  </g>
  <text x="400" y="370" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="22" font-weight="bold" opacity="0.95">Turn Your Website Into a Sales Machine</text>
  <text x="400" y="400" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="14" opacity="0.7">CGNV MARKETING</text>
</svg>