<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e65100"/>
      <stop offset="100%" style="stop-color:#b71c1c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="670" cy="80" r="50" fill="white" opacity="0.05"/>
  <circle cx="130" cy="360" r="44" fill="white" opacity="0.05"/>
  <!-- Rocket icon -->
  <g transform="translate(400,170)" opacity="0.9">
    <!-- Rocket body -->
    <path d="M0,-75 C-15,-55 -18,-20 -18,15 L18,15 C18,-20 15,-55 0,-75 Z" fill="white" opacity="0.2" stroke="white" stroke-width="2"/>
    <!-- Rocket nose -->
    <circle cx="0" cy="-60" r="5" fill="white" opacity="0.7"/>
    <!-- Rocket window -->
    <circle cx="0" cy="-30" r="10" fill="white" opacity="0.3" stroke="white" stroke-width="1.5"/>
    <!-- Fins -->
    <path d="M-18,0 L-35,20 L-18,15 Z" fill="white" opacity="0.4"/>
    <path d="M18,0 L35,20 L18,15 Z" fill="white" opacity="0.4"/>
    <!-- Flame -->
    <path d="M-12,15 Q-8,35 0,50 Q8,35 12,15" fill="white" opacity="0.6"/>
    <path d="M-6,15 Q-3,30 0,40 Q3,30 6,15" fill="white" opacity="0.8"/>
    <!-- Speed lines -->
    <line x1="-40" y1="30" x2="-60" y2="50" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <line x1="40" y1="30" x2="60" y2="50" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <line x1="-30" y1="45" x2="-45" y2="60" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
    <line x1="30" y1="45" x2="45" y2="60" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
    <!-- Stars -->
    <circle cx="-50" cy="-50" r="2" fill="white" opacity="0.5"/>
    <circle cx="55" cy="-40" r="2" fill="white" opacity="0.5"/>
    <circle cx="-60" cy="-20" r="1.5" fill="white" opacity="0.4"/>
    <circle cx="65" cy="-10" r="1.5" fill="white" opacity="0.4"/>
  </g>
  <text x="400" y="370" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="22" font-weight="bold" opacity="0.95">Performance Marketing at Scale</text>
  <text x="400" y="400" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="14" opacity="0.7">CGNV MARKETING</text>
</svg>