<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2e7d32"/>
      <stop offset="100%" style="stop-color:#00838f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="680" cy="70" r="48" fill="white" opacity="0.05"/>
  <circle cx="120" cy="370" r="36" fill="white" opacity="0.05"/>
  <!-- Map pin / location icon -->
  <g transform="translate(400,165)" opacity="0.9">
    <!-- Map pin -->
    <path d="M0,-70 C-30,-70 -45,-45 -45,-25 C-45,10 0,55 0,55 C0,55 45,10 45,-25 C45,-45 30,-70 0,-70 Z" fill="white" opacity="0.2" stroke="white" stroke-width="2.5"/>
    <circle cx="0" cy="-30" r="15" fill="white" opacity="0.8"/>
    <!-- Radiating circles -->
    <circle cx="0" cy="-30" r="30" fill="none" stroke="white" stroke-width="1" opacity="0.3"/>
    <circle cx="0" cy="-30" r="50" fill="none" stroke="white" stroke-width="1" opacity="0.2"/>
    <circle cx="0" cy="-30" r="70" fill="none" stroke="white" stroke-width="1" opacity="0.1"/>
    <!-- Small people dots -->
    <circle cx="-55" cy="20" r="4" fill="white" opacity="0.6"/>
    <circle cx="60" cy="10" r="4" fill="white" opacity="0.6"/>
    <circle cx="-40" cy="40" r="4" fill="white" opacity="0.5"/>
    <circle cx="50" cy="40" r="4" fill="white" opacity="0.5"/>
    <circle cx="0" cy="70" r="3" fill="white" opacity="0.4"/>
  </g>
  <text x="400" y="370" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="22" font-weight="bold" opacity="0.95">Local SEO: Attract Nearby Customers</text>
  <text x="400" y="400" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="14" opacity="0.7">CGNV MARKETING</text>
</svg>