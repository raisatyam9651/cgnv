<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1565c0"/>
      <stop offset="100%" style="stop-color:#283593"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="690" cy="70" r="50" fill="white" opacity="0.05"/>
  <circle cx="110" cy="370" r="40" fill="white" opacity="0.05"/>
  <!-- Bar chart icon -->
  <g transform="translate(400,165)" opacity="0.9">
    <!-- Chart background -->
    <rect x="-70" y="-60" width="140" height="120" rx="6" fill="white" opacity="0.1" stroke="white" stroke-width="2"/>
    <!-- Grid lines -->
    <line x1="-55" y1="-35" x2="55" y2="-35" stroke="white" stroke-width="0.5" opacity="0.2"/>
    <line x1="-55" y1="-10" x2="55" y2="-10" stroke="white" stroke-width="0.5" opacity="0.2"/>
    <line x1="-55" y1="15" x2="55" y2="15" stroke="white" stroke-width="0.5" opacity="0.2"/>
    <line x1="-55" y1="40" x2="55" y2="40" stroke="white" stroke-width="0.5" opacity="0.2"/>
    <!-- Bars -->
    <rect x="-50" y="10" width="16" height="30" rx="2" fill="white" opacity="0.5"/>
    <rect x="-28" y="-5" width="16" height="45" rx="2" fill="white" opacity="0.6"/>
    <rect x="-6" y="-25" width="16" height="65" rx="2" fill="white" opacity="0.7"/>
    <rect x="16" y="-15" width="16" height="55" rx="2" fill="white" opacity="0.65"/>
    <rect x="38" y="-40" width="16" height="80" rx="2" fill="white" opacity="0.85"/>
    <!-- Trend line -->
    <polyline points="-42,5 -20,-10 2,-30 24,-20 46,-45" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Dots on trend -->
    <circle cx="-42" cy="5" r="3" fill="white"/>
    <circle cx="-20" cy="-10" r="3" fill="white"/>
    <circle cx="2" cy="-30" r="3" fill="white"/>
    <circle cx="24" cy="-20" r="3" fill="white"/>
    <circle cx="46" cy="-45" r="3" fill="white"/>
    <!-- Magnifier accent -->
    <circle cx="65" cy="-55" r="12" fill="none" stroke="white" stroke-width="2" opacity="0.4"/>
    <line x1="73" y1="-47" x2="80" y2="-40" stroke="white" stroke-width="2" opacity="0.4"/>
  </g>
  <text x="400" y="370" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="22" font-weight="bold" opacity="0.95">Google Analytics: Track What Matters</text>
  <text x="400" y="400" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="14" opacity="0.7">CGNV MARKETING</text>
</svg>