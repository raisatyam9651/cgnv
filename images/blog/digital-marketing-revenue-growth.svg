<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a73e8"/>
      <stop offset="100%" style="stop-color:#0097a7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="650" cy="80" r="60" fill="white" opacity="0.05"/>
  <circle cx="150" cy="350" r="40" fill="white" opacity="0.05"/>
  <!-- Revenue growth chart icon -->
  <g transform="translate(400,180)" fill="none" stroke="white" stroke-width="3" opacity="0.9">
    <!-- Chart base -->
    <rect x="-80" y="-60" width="160" height="120" rx="8" fill="white" opacity="0.15" stroke="none"/>
    <!-- Bars -->
    <rect x="-60" y="20" width="20" height="35" rx="3" fill="white" opacity="0.7" stroke="none"/>
    <rect x="-30" y="0" width="20" height="55" rx="3" fill="white" opacity="0.8" stroke="none"/>
    <rect x="0" y="-15" width="20" height="70" rx="3" fill="white" opacity="0.85" stroke="none"/>
    <rect x="30" y="-35" width="20" height="90" rx="3" fill="white" opacity="0.95" stroke="none"/>
    <!-- Growth arrow -->
    <polyline points="-50,15 -20,-5 10,-25 40,-45" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="40,-45 32,-38 40,-33" fill="white" stroke="none"/>
    <!-- Dollar sign -->
    <circle cx="0" cy="-90" r="22" fill="white" opacity="0.2" stroke="none"/>
    <text x="0" y="-83" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="22" font-weight="bold">$</text>
  </g>
  <text x="400" y="370" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="22" font-weight="bold" opacity="0.95">Digital Marketing &amp; Revenue Growth</text>
  <text x="400" y="400" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="14" opacity="0.7">CGNV MARKETING</text>
</svg>