<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1565c0"/>
      <stop offset="100%" style="stop-color:#00897b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="690" cy="75" r="50" fill="white" opacity="0.05"/>
  <circle cx="110" cy="360" r="42" fill="white" opacity="0.05"/>
  <!-- Handshake / search icon -->
  <g transform="translate(400,170)" opacity="0.9">
    <!-- Magnifying glass -->
    <circle cx="-15" cy="-10" r="40" fill="white" opacity="0.15" stroke="white" stroke-width="2.5"/>
    <line x1="15" y1="20" x2="45" y2="50" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <!-- Handshake inside glass -->
    <path d="M-35,-10 L-20,-10 L-10,-20 L5,-10 L15,-10" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-10,-20 L-5,-25 L5,-15 L10,-20" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Checkmark -->
    <circle cx="50" cy="-40" r="18" fill="white" opacity="0.25" stroke="none"/>
    <polyline points="42,-40 48,-34 60,-48" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Stars -->
    <text x="-65" y="-40" fill="white" font-family="Arial,sans-serif" font-size="16" opacity="0.5">&#9733;</text>
    <text x="55" y="10" fill="white" font-family="Arial,sans-serif" font-size="12" opacity="0.4">&#9733;</text>
  </g>
  <text x="400" y="370" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="22" font-weight="bold" opacity="0.95">How to Choose a Digital Marketing Agency</text>
  <text x="400" y="400" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="14" opacity="0.7">CGNV MARKETING</text>
</svg>