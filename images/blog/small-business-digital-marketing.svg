<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00838f"/>
      <stop offset="100%" style="stop-color:#2e7d32"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="685" cy="85" r="52" fill="white" opacity="0.05"/>
  <circle cx="115" cy="355" r="40" fill="white" opacity="0.05"/>
  <!-- Store/building icon -->
  <g transform="translate(400,165)" opacity="0.9">
    <!-- Building base -->
    <rect x="-50" y="-30" width="100" height="80" rx="4" fill="white" opacity="0.15" stroke="white" stroke-width="2"/>
    <!-- Roof/awning -->
    <path d="M-55,-30 L-55,-45 L55,-45 L55,-30" fill="white" opacity="0.25" stroke="white" stroke-width="2"/>
    <path d="M-55,-30 Q-37,-20 -18,-30 Q0,-20 18,-30 Q37,-20 55,-30" fill="none" stroke="white" stroke-width="2"/>
    <!-- Door -->
    <rect x="-12" y="15" width="24" height="35" rx="3" fill="white" opacity="0.3" stroke="white" stroke-width="1.5"/>
    <circle cx="8" cy="33" r="2" fill="white" opacity="0.7"/>
    <!-- Window -->
    <rect x="-40" y="-15" width="22" height="18" rx="2" fill="white" opacity="0.25" stroke="white" stroke-width="1.5"/>
    <rect x="18" y="-15" width="22" height="18" rx="2" fill="white" opacity="0.25" stroke="white" stroke-width="1.5"/>
    <!-- WiFi/digital signal -->
    <path d="M55,-55 Q65,-55 65,-45" fill="none" stroke="white" stroke-width="2" opacity="0.5"/>
    <path d="M55,-65 Q75,-65 75,-45" fill="none" stroke="white" stroke-width="2" opacity="0.4"/>
    <path d="M55,-75 Q85,-75 85,-45" fill="none" stroke="white" stroke-width="2" opacity="0.3"/>
    <circle cx="55" cy="-45" r="3" fill="white" opacity="0.7"/>
  </g>
  <text x="400" y="370" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="22" font-weight="bold" opacity="0.95">Digital Marketing for Small Business</text>
  <text x="400" y="400" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="14" opacity="0.7">CGNV MARKETING</text>
</svg>