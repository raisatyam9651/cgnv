<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2e7d32"/>
      <stop offset="100%" style="stop-color:#00838f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="695" cy="70" r="46" fill="white" opacity="0.05"/>
  <circle cx="105" cy="370" r="38" fill="white" opacity="0.05"/>
  <!-- Checklist icon -->
  <g transform="translate(400,165)" opacity="0.9">
    <!-- Clipboard -->
    <rect x="-45" y="-55" width="90" height="120" rx="6" fill="white" opacity="0.15" stroke="white" stroke-width="2"/>
    <rect x="-20" y="-65" width="40" height="15" rx="4" fill="white" opacity="0.3" stroke="white" stroke-width="1.5"/>
    <!-- Checklist items -->
    <!-- Item 1 - checked -->
    <rect x="-32" y="-35" width="14" height="14" rx="3" fill="white" opacity="0.3" stroke="white" stroke-width="1.5"/>
    <polyline points="-29,-28 -26,-24 -21,-32" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-10" y="-33" width="40" height="4" rx="2" fill="white" opacity="0.5"/>
    <!-- Item 2 - checked -->
    <rect x="-32" y="-10" width="14" height="14" rx="3" fill="white" opacity="0.3" stroke="white" stroke-width="1.5"/>
    <polyline points="-29,-3 -26,1 -21,-7" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-10" y="-8" width="35" height="4" rx="2" fill="white" opacity="0.5"/>
    <!-- Item 3 - checked -->
    <rect x="-32" y="15" width="14" height="14" rx="3" fill="white" opacity="0.3" stroke="white" stroke-width="1.5"/>
    <polyline points="-29,22 -26,26 -21,18" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-10" y="17" width="42" height="4" rx="2" fill="white" opacity="0.5"/>
    <!-- Item 4 - unchecked -->
    <rect x="-32" y="40" width="14" height="14" rx="3" fill="white" opacity="0.15" stroke="white" stroke-width="1.5"/>
    <rect x="-10" y="42" width="30" height="4" rx="2" fill="white" opacity="0.3"/>
    <!-- Pencil -->
    <line x1="55" y1="40" x2="70" y2="-5" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <polygon points="70,-5 73,-12 67,-12" fill="white" opacity="0.6"/>
  </g>
  <text x="400" y="370" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="22" font-weight="bold" opacity="0.95">Your Digital Marketing Checklist</text>
  <text x="400" y="400" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="14" opacity="0.7">CGNV MARKETING</text>
</svg>