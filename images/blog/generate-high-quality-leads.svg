<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7b1fa2"/>
      <stop offset="100%" style="stop-color:#c2185b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="680" cy="90" r="58" fill="white" opacity="0.05"/>
  <circle cx="120" cy="350" r="42" fill="white" opacity="0.05"/>
  <!-- Target/magnet icon -->
  <g transform="translate(400,170)" opacity="0.9">
    <!-- Target rings -->
    <circle cx="0" cy="-10" r="55" fill="none" stroke="white" stroke-width="2" opacity="0.4"/>
    <circle cx="0" cy="-10" r="38" fill="none" stroke="white" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="-10" r="20" fill="none" stroke="white" stroke-width="2" opacity="0.8"/>
    <circle cx="0" cy="-10" r="6" fill="white" opacity="0.9"/>
    <!-- Arrow hitting target -->
    <line x1="50" y1="-60" x2="5" y2="-15" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="5,-15 12,-22 18,-12" fill="white" opacity="0.9"/>
    <!-- Magnet shape to the right -->
    <path d="M60,15 L60,45 C60,65 80,65 80,45 L80,15" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <rect x="56" y="10" width="8" height="10" fill="white" opacity="0.7" rx="1"/>
    <rect x="76" y="10" width="8" height="10" fill="white" opacity="0.7" rx="1"/>
    <!-- Small dots attracted -->
    <circle cx="70" cy="-5" r="3" fill="white" opacity="0.5"/>
    <circle cx="65" cy="0" r="3" fill="white" opacity="0.6"/>
    <circle cx="75" cy="2" r="3" fill="white" opacity="0.5"/>
  </g>
  <text x="400" y="370" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="22" font-weight="bold" opacity="0.95">Generate High-Quality Leads Online</text>
  <text x="400" y="400" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="14" opacity="0.7">CGNV MARKETING</text>
</svg>