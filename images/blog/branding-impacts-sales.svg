<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6a1b9a"/>
      <stop offset="100%" style="stop-color:#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="675" cy="75" r="48" fill="white" opacity="0.05"/>
  <circle cx="125" cy="365" r="36" fill="white" opacity="0.05"/>
  <!-- Badge/star icon -->
  <g transform="translate(400,165)" opacity="0.9">
    <!-- Badge circle -->
    <circle cx="0" cy="-15" r="50" fill="white" opacity="0.15" stroke="white" stroke-width="2.5"/>
    <!-- Star inside -->
    <polygon points="0,-40 8,-22 28,-22 12,-10 18,8 0,-2 -18,8 -12,-10 -28,-22 -8,-22" fill="white" opacity="0.8"/>
    <!-- Ribbon tails -->
    <path d="M-30,30 L-40,65 L-25,55 L-15,70 L-15,30" fill="white" opacity="0.3"/>
    <path d="M30,30 L40,65 L25,55 L15,70 L15,30" fill="white" opacity="0.3"/>
    <!-- Sparkles -->
    <line x1="-60" y1="-40" x2="-60" y2="-55" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <line x1="-67" y1="-47" x2="-53" y2="-47" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <line x1="60" y1="-35" x2="60" y2="-50" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <line x1="53" y1="-42" x2="67" y2="-42" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  </g>
  <text x="400" y="370" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="22" font-weight="bold" opacity="0.95">How Branding Impacts Your Sales</text>
  <text x="400" y="400" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="14" opacity="0.7">CGNV MARKETING</text>
</svg>