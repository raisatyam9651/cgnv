<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7b1fa2"/>
      <stop offset="100%" style="stop-color:#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="680" cy="60" r="50" fill="white" opacity="0.05"/>
  <circle cx="120" cy="380" r="35" fill="white" opacity="0.05"/>
  <!-- Globe/network icon -->
  <g transform="translate(400,180)" opacity="0.9">
    <circle cx="0" cy="0" r="55" fill="none" stroke="white" stroke-width="2.5"/>
    <ellipse cx="0" cy="0" rx="30" ry="55" fill="none" stroke="white" stroke-width="2"/>
    <line x1="-55" y1="0" x2="55" y2="0" stroke="white" stroke-width="2"/>
    <line x1="-50" y1="-25" x2="50" y2="-25" stroke="white" stroke-width="1.5"/>
    <line x1="-50" y1="25" x2="50" y2="25" stroke="white" stroke-width="1.5"/>
    <!-- Connection dots -->
    <circle cx="-40" cy="-30" r="5" fill="white" opacity="0.8"/>
    <circle cx="35" cy="20" r="5" fill="white" opacity="0.8"/>
    <circle cx="0" cy="-55" r="5" fill="white" opacity="0.8"/>
    <circle cx="-30" cy="40" r="5" fill="white" opacity="0.8"/>
    <circle cx="45" cy="-10" r="5" fill="white" opacity="0.8"/>
    <!-- Connection lines -->
    <line x1="-40" y1="-30" x2="0" y2="-55" stroke="white" stroke-width="1" opacity="0.5"/>
    <line x1="35" y1="20" x2="45" y2="-10" stroke="white" stroke-width="1" opacity="0.5"/>
    <line x1="-30" y1="40" x2="35" y2="20" stroke="white" stroke-width="1" opacity="0.5"/>
  </g>
  <text x="400" y="370" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="22" font-weight="bold" opacity="0.95">Build Your Online Presence</text>
  <text x="400" y="400" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="14" opacity="0.7">CGNV MARKETING</text>
</svg>